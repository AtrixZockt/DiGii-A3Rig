[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a3rig"
version = "0.1.0"
description = "Start a local Arma 3 mod test rig (HEMTT dev build + 2 clients + dedicated server) with one command"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DiGii" }]
keywords = ["arma3", "hemtt", "modding", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "psutil>=5.9",
    "tomlkit>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
a3rig = "a3rig.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/a3rig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
