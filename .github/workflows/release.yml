name: Release

# Tagging `v<version>` builds the standalone Windows executable, publishes it as a
# GitHub release, and attaches ready-to-submit winget manifests.
#
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,build]"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { '${{ inputs.version }}' }
          $declared = (python -c "import a3rig; print(a3rig.__version__)").Trim()
          if ($version -ne $declared) {
            throw "tag v$version does not match __version__ $declared - bump src/a3rig/__init__.py first"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # A broken build must never reach a release.
      - name: Test
        run: python -m pytest -q

      - name: Build the standalone executable
        run: python -m PyInstaller packaging/a3rig.spec --noconfirm

      - name: Smoke-test the frozen build
        shell: pwsh
        run: |
          $out = & dist\a3rig\a3rig.exe --version
          if ($out -notmatch '${{ steps.version.outputs.version }}') { throw "unexpected --version output: $out" }
          Write-Host "ok: $out"

      - name: Package
        id: package
        shell: pwsh
        run: |
          $asset = 'a3rig-windows-x64.zip'
          Compress-Archive -Path dist\a3rig -DestinationPath $asset -Force
          $sha = (Get-FileHash $asset -Algorithm SHA256).Hash
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "asset=$asset" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256: $sha"

      - name: Generate winget manifests
        shell: pwsh
        run: |
          ./packaging/make-winget-manifests.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -Sha256 '${{ steps.package.outputs.sha256 }}' `
            -OutputDir winget-manifests `
            -Repo '${{ github.repository }}'
          # Zip the folder, not its contents, so extracting always yields a single
          # winget-manifests\ folder to point `wingetcreate submit` at.
          Compress-Archive -Path winget-manifests -DestinationPath winget-manifests.zip -Force

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $notes = @"
          Install with winget:

          ``````
          winget install DiGii.A3Rig
          ``````

          Or download ``${{ steps.package.outputs.asset }}`` below and run ``a3rig.exe`` - it is
          self-contained and needs no Python installed.

          SHA256: ``${{ steps.package.outputs.sha256 }}``
          "@
          gh release create "v$version" `
            --title "a3rig $version" `
            --notes $notes `
            '${{ steps.package.outputs.asset }}' `
            'winget-manifests.zip'
