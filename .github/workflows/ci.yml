name: CI

# Catches regressions on the way in, rather than at release time when the tag is already
# cut and the version already bumped.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor promised by requires-python, so it gets tested too - day-to-day
        # development happens on 3.12.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      # Cheap guard: the CLI has to at least import and start on every supported version.
      - name: Smoke-test the CLI
        run: python -m a3rig.cli --version
